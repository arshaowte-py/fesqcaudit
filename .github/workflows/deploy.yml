name: Deploy to Firebase

# Merge to main ships to production. There is no separate staging environment;
# the smoke check at the end is what stands between a bad merge and a broken
# site, so it is allowed to fail the run.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy without pushing a commit

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy that is already running

permissions:
  contents: read
  id-token: write           # required to mint the GitHub OIDC token for Google

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22   # matches the Cloud Functions runtime
          cache: npm

      - run: npm ci

      # Guard rails that matter most for changes made quickly: every API route
      # is session-guarded, the CSP is per-request so the app can hydrate, the
      # shell is not served statically, redirects stay relative.
      - name: Run tests
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # --force auto-accepts the Artifact Registry cleanup policy prompt.
      # Without it, a missing policy fails the run AFTER functions deploy but
      # BEFORE the hosting release, leaving the site serving "Site Not Found"
      # while the log looks almost successful.
      #
      # The project comes from .firebaserc, never from the CLI's machine-wide
      # directory->project map.
      - name: Deploy
        run: |
          firebase deploy \
            --project "$(node scripts/firebase-project.mjs)" \
            --only hosting,functions,firestore:rules,firestore:indexes \
            --force \
            --non-interactive

      # Cloud Run needs a moment to shift traffic to the new revision.
      - name: Wait for rollout
        run: sleep 20

      # The deploy log is not evidence the site works. This asserts, against
      # the live URL, that the app actually hydrates and that every API still
      # rejects anonymous callers.
      - name: Smoke check the live site
        run: npm run smoke

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::error::Deploy failed. Production may be running the PREVIOUS version, or a half-updated one."
          echo ""
          echo "Check, in order:"
          echo "  1. Which step went red above."
          echo "  2. If 'Run tests' failed, the code is broken - fix it and merge again. Nothing was deployed."
          echo "  3. If 'Deploy' failed, nothing may have been released. Re-run this workflow from the Actions tab."
          echo "  4. If 'Smoke check' failed, the deploy SUCCEEDED but the live site is not healthy."
          echo "     Read which check failed - it names the problem. Revert the merge and re-run to roll back."
          exit 1
