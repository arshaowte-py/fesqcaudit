<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frido Store Audit — QC Portal</title>
  <meta name="description"
    content="Frido Store Audit quality control portal — audit forms, dashboard analytics, and response management.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFD200">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Frido QC">
  <link rel="icon" href="/assets/frido-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/frido-logo.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/app.css?v=11">
  <link rel="stylesheet" href="/assets/audit-form.css?v=11">
  <link rel="stylesheet" href="/assets/dashboard.css?v=11">
  <link rel="stylesheet" href="/assets/responses.css?v=11">
</head>

<body>

  <!-- ═══════════════════════════════════════════════
       APP SHELL — Sidebar + Main Wrapper
       ═══════════════════════════════════════════════ -->
  <div class="app-shell">

    <!-- Sidebar Overlay (mobile click-out) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── Sidebar (48px collapsed strip + 240px expanded) ── -->
    <aside class="sidebar" id="sidebar">

      <!-- Collapsed strip: yellow logo chip + accent line -->
      <div class="sidebar-collapsed">
        <button class="sidebar-collapsed-logo" id="sidebarOpenBtn" aria-label="Open sidebar" title="Open sidebar">
          <img src="/assets/store-audit-logo.png" alt="" class="sidebar-collapsed-logo-img">
        </button>
      </div>
      <div class="sidebar-accent-line"></div>

      <!-- Expanded panel -->
      <div class="sidebar-expanded">
        <!-- Brand header -->
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <img src="/assets/store-audit-logo.png" alt="Frido Store Audit — QC Visit Report" class="sidebar-brand-logo">
          </div>
          <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- Navigation -->
        <ul class="sidebar-nav">
          <li class="sidebar-nav-item active" data-view="dashboard">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </li>
          <li class="sidebar-nav-item" data-view="audit-form">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="9" y1="13" x2="15" y2="13" />
                <line x1="9" y1="17" x2="15" y2="17" />
              </svg>
            </span>
            <span class="nav-label">Audit Form</span>
          </li>
          <li class="sidebar-nav-item" data-view="responses">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
            </span>
            <span class="nav-label">Response Copies</span>
          </li>
        </ul>

        <!-- Footer (theme toggle) -->
        <div class="sidebar-footer">
          <button class="dark-mode-toggle" aria-label="Toggle dark mode" title="Dark mode (coming soon)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ── Main Wrapper (header + content + footer) ── -->
    <div class="main-wrapper">

      <!-- ═══ HEADER ═══ -->
      <header class="header" id="mainHeader">
        <div class="header-left">
          <button class="header-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Search -->
        <div class="header-search">
          <span class="search-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="globalSearch" placeholder="Search stores, audits &amp; links..." autocomplete="off">
          <span class="search-shortcut">Ctrl+K</span>
        </div>
      </header>

      <!-- ═══ CONTENT AREA ═══ -->
      <main class="content-area">

        <!-- ────── VIEW: Dashboard ────── -->
        <div id="view-dashboard" class="view active">
          <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Loading audit data…</p>
          </div>
        </div>

        <!-- ────── VIEW: Audit Form ────── -->
        <div id="view-audit-form" class="view">

          <div class="page-title-row">
            <div>
              <h1 class="page-title">New Audit Report</h1>
              <p class="page-subtitle">Complete every checkpoint and submit your store visit report.</p>
            </div>
            <div class="form-score-bar">
              <div class="live-score" id="liveScore">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="scoreValue">0</span>
                <span class="score-divider">/</span>
                <span class="score-max">70</span>
              </div>
            </div>
          </div>

          <section class="card store-details" id="storeDetails">
            <h2 class="card-title">Store Details</h2>
            <div class="form-grid">
              <div class="form-group" id="fg-storeName">
                <label for="storeName">Store Name <span class="req">*</span></label>
                <select id="storeName" required>
                  <option value="">— Select Store —</option>
                  <option>Phoenix Marketcity, Viman Nagar</option>
                  <option>Amanora Mall, Magarpatta</option>
                  <option>Amar Tech Park, Balewadi</option>
                  <option>Elpro Mall, PCMC</option>
                  <option>Westend Mall, Aundh Pune</option>
                  <option>Kopa Mall, Ghorpadi, KP</option>
                  <option>Mall of Asia, Bangalore</option>
                  <option>Lakeshore Mall, Y Junction</option>
                  <option>Sky City Mall, Borivali</option>
                  <option>Gachibowli, Hyderabad</option>
                  <option>Banjara Hills, Hyderabad</option>
                  <option>DLF Mall, Gurgaon, Delhi</option>
                  <option>Bhartiya Mall, Bangalore</option>
                  <option>Kompally, Hyderabad</option>
                </select>
              </div>
              <div class="form-group" id="fg-location">
                <label for="location">Location <span class="req">*</span></label>
                <input type="text" id="location" placeholder="City / Mall / Street" required>
              </div>
              <div class="form-group" id="fg-auditorName">
                <label for="auditorName">Auditor Name <span class="req">*</span></label>
                <input type="text" id="auditorName" placeholder="Your full name" required>
              </div>
              <div class="form-group" id="fg-auditeeName">
                <label for="auditeeName">Auditee Name</label>
                <input type="text" id="auditeeName" placeholder="Store Manager">
              </div>
              <div class="form-group" id="fg-visitDate">
                <label for="visitDate">Visit Date <span class="req">*</span></label>
                <input type="date" id="visitDate" required>
              </div>
            </div>
          </section>

          <div id="sectionsContainer"></div>

          <button class="btn-submit" id="btnSubmit" type="button">Submit Audit Report →</button>
        </div>

        <!-- ────── VIEW: Responses ────── -->
        <div id="view-responses" class="view"></div>

      </main>

      <!-- ═══ FOOTER ═══ -->
      <footer class="footer">
        <div class="footer-line"></div>
        <div class="footer-top">
          <div class="footer-top-left">
            <div class="footer-brand">
              <img src="/assets/footer_logo.png" alt="frido" class="footer-logo">
              <div class="footer-copyright">&copy; 2026 ALL RIGHTS RESERVED.</div>
            </div>
          </div>
          <div class="footer-top-center">
            <div class="footer-slogan">Freedom To Do More</div>
          </div>
          <div class="footer-top-right">
            <div class="footer-socials">
              <a href="https://www.instagram.com/myfrido/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                  <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
              </a>
              <a href="https://www.facebook.com/myfrido/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>
              </a>
              <a href="https://www.linkedin.com/company/myfrido" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                  <rect x="2" y="9" width="4" height="12"></rect>
                  <circle cx="4" cy="4" r="2"></circle>
                </svg>
              </a>
              <a href="https://x.com/frido_official" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="X (Twitter)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4l11.733 16h4.267l-11.733 -16z"></path>
                  <path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </footer>

    </div>
  </div>

  <!-- ═══ LOADING OVERLAY ═══ -->
  <div class="overlay" id="loadingOverlay">
    <div class="overlay-card">
      <div class="logo-mark"
        style="font-size:36px;margin-bottom:16px;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#0A0A0A">
        frido</div>
      <div class="spinner"></div>
      <p style="margin-top:16px;color:#4B5563">Submitting audit report…</p>
    </div>
  </div>

  <!-- ═══ SUCCESS OVERLAY ═══ -->
  <div class="overlay" id="successOverlay">
    <div class="overlay-card success-card">
      <img
        src="/assets/audit-success-logo.png"
        alt="Frido Store Audit — QC Visit Report"
        class="success-logo"
        width="220"
        height="220"
      >
      <div class="success-stars" id="successStars"></div>
      <h2>Audit Submitted Successfully</h2>
      <div class="success-details" id="successDetails"></div>
      <div class="success-actions">
        <button type="button" class="btn-success-cancel" id="btnCancelSuccess">Cancel</button>
        <button type="button" class="btn-new" id="btnNewAudit">Start New Audit</button>
      </div>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast" id="toast"></div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="/assets/app.js?v=11"></script>
  <script src="/assets/audit-form.js?v=11"></script>
  <script src="/assets/dashboard.js?v=11"></script>
  <script src="/assets/responses.js?v=11"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=11')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>

</body>

</html>
